<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dev Docs - Autenticação</title>
  <script type="text/javascript">
    // Este script é especificamente para a página de callback
    // Ele vai extrair o código da URL e redirecionar para a rota correta no Vue Router
    function getParameterByName(name, url = window.location.href) {
      name = name.replace(/[\[\]]/g, '\\$&');
      var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
          results = regex.exec(url);
      if (!results) return null;
      if (!results[2]) return '';
      return decodeURIComponent(results[2].replace(/\+/g, ' '));
    }
    
    // Obter o código da URL
    var code = getParameterByName('code');
    
    if (code) {
      // Redirecionar para a aplicação Vue com o código
      window.location.href = '/documentacao/#/auth/callback?code=' + code;
    } else {
      // Se não houver código, redirecionar para a página inicial
      window.location.href = '/documentacao/';
    }
  </script>
</head>
<body>
  <h2>Autenticando...</h2>
  <p>Por favor, aguarde enquanto processamos sua autenticação.</p>
</body>
</html>
